apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-app
  namespace: whoapp

spec:
  replicas: 10

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
        - name: hello-app
          image: traefik/whoami:v1.11
          args:
            - --name=canary-v2
          ports:
            - containerPort: 80

          envFrom:
            - secretRef:
                name: app-secret

  strategy:
    canary:
      stableService: hello-app-active
      canaryService: hello-app-preview
      steps:
        - setWeight: 25
        - pause: {}

        - setWeight: 50
        - pause:
            duration: 10s

        - setWeight: 75
        - pause:
            duration: 10s

        - setWeight: 100